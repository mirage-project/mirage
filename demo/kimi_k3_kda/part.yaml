# The K3 KDA layer as a loop part (python/mirage/mpk/loop/part.py): the whole layer (part.py's graph: projection, short conv,
# recurrence, o_proj with push, attn_residual on cluster pairs; SGLang's serving contract).
name: kimi_k3_kda
model: Kimi K3
layers: "the KDA layers (kda_layers in config.json, 69 layers)"
module: part.py
tp: 8
machine: {gpu: NVIDIA B300 SXM6 PC, cuda: "13.0"}
buckets:
  8:
    inputs:
      harness_l0: ~/mk/kda_ref          # the hand-written KDA kernel's harness (1 bank row build), rank 0, step 0 (10-07)
    bound_us: null
    sglang_us: 42.9                     # SGLang's own KDA path per layer in the server (09-08, profiler on)
phases:
  projection: [proj_partial, rec_in]
  recurrence: [y_rec]
  oproj: [oproj_partial]
  exchange: [oproj_sent]
  residual: [hidden]
error_limits:
  oproj_rel: 2.0e-2                     # the KDA harness's tolerance (50_harness.cuh vtol 2 % + abs)
  oproj_abs: 1.0e-2
  derivation: >-
    The KDA harness checks attn_local with 2 % relative + 0.01 absolute against its double reference; the port keeps the
    harness's tolerances so a port step passes exactly when the hand-written kernel's own check would.
flush_bytes: 536870912
graph_options:
  num_sms: 0                          # the graph's SMs per GPU (0: the current device's; code generation without a GPU: 148)
  eps: 0                              # the RMSNorm eps of o_norm and the attention residual (0: 1e-6, the harness's; K3: rms_norm_eps)
promote_on: harness                   # no KDA plug-in on the static compiler yet: promotion by the harness (round_job.py)
