# The K3 MoE layer as a loop part (python/mirage/mpk/loop/part.py).
name: kimi_k3_moe
model: Kimi K3
layers: the 92 MoE layers (one graph = one layer; every layer has the same shapes)
module: part.py
tp: 8
machine: {gpu: NVIDIA B300 SXM6 PC, cuda: "13.0"}
buckets:
  8:
    inputs:
      layer1: ~/mk/moe_layer          # layer 1's weights and one decode step's x (demo.py load_weights)
    bound_us: null                    # not derived yet (rule A4)
    sglang_us: 74.7                   # SGLang's in-server MoE time per layer: 6875.3 us over 92 layers (job 76, 10-04)
phases:                               # by each node's first output tensor (demo.py build_graph)
  front: [router_logits, routing_pairs, latent_z, latent_z_mxfp8, shared_gate_up, shared_act, shared_down_partial, s_sent]
  experts: [routed_sum_partial]
  tail: [r_sent, routed_normed, shared_summed, latent_up_partial, latent_up_out, moe_out]
error_limits:
  y_relrms: 2.0e-2                    # y vs SGLang's y
  partial_relrms: 1.0e-3              # each GPU's routed / shared-down partial sums vs their fp32 references
  derivation: >-
    y: ours vs SGLang in the server's shadow check measured relRMS 2e-3..1.7e-2 per layer with the same answers (job 77,
    10-04), so 2e-2 is that largest value plus margin.
    Partials: fp32 sums in a fixed order; the shared-down partial differs by up to about 1e-4 with shared gate_up's K split.
server: {before: attn_res, after: moe layer's last kernel}
flush_bytes: 536870912
graph_options:
  rmsnorm_recompute: false
