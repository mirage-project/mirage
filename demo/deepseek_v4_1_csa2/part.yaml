# The DeepSeek-V4.1-Flash attention layer as a loop part (python/mirage/mpk/loop/part.py): demo.py's graph, for the variant of the
# graph option layer (5 graphs: L0 swa, L2 full_r2, L3 reuse, L20 full_r1, L24 reindex).
name: deepseek_v4_1_csa2
model: DeepSeek-V4.1-Flash
layers: the 40 attention layers (one graph per variant)
module: part.py
tp: 4
machine: {gpu: NVIDIA B300 SXM6 PC, cuda: "13.0"}
buckets:
  8:
    inputs:
      dsv41_ref: ~/mk/dsv41_ref       # a checkpoint directory with the layers' shards and inference/config.json
    bound_us: null                    # not derived yet
    sglang_us: null                   # SGLang's in-server time per layer: not measured yet
phases:                               # by each node's first output tensor (demo.py build_graph)
  front: [x_q, wq_a_part, qr_q, wq_b_part, wkv_part, window_cache]
  compressor: [cmp_part, latent, compress_cache]
  indexer: [wk_part, index_k, iq_part, q_idx, wp_part, scores, compress_idx]
  attention: [o_q]
  tail: [wo_a_part, oa_q, wo_b_part, y]
error_limits:
  y_relrms: 2.5e-2                    # y vs the official implementation's y
  derivation: >-
    the largest y relRMS of the golden cases on 4 GPUs is 2.41e-2 (L20, where one token's top-k differs from the official one);
    on the steps with the official top-k it is 8.85e-3.
flush_bytes: 536870912
graph_options:
  layer: 3                            # the layer whose weights and variant the run uses
  pos: 4096                           # the position of the 8 tokens (random inputs)
