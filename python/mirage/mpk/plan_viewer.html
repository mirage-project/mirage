<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megakernel Plan Viewer</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --text: #1d2330; --muted: #6b7380; --accent: #2563eb;
  --sel: #111827; --dep: #dc2626; --cons: #2563eb; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
header .grow { flex: 1; }
button, select, input { font: inherit; }
button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button:hover { border-color: #b9c0ca; }
select { border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; background: #fff; }
.files { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 12px; padding: 1px 8px 1px 6px; display: inline-flex; align-items: center; gap: 4px; background: #fff; }
.chip input { margin: 0; }
main { display: grid; grid-template-columns: 250px 1fr 380px; min-height: 0; height: 100%; overflow: hidden; }
#left, #right { background: var(--panel); overflow: auto; min-height: 0; }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); padding: 10px 12px; }
#center { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.pane { display: flex; flex-direction: column; min-height: 0; flex: 1; border-bottom: 2px solid var(--line); }
.pane:last-child { border-bottom: 0; }
.pane-title { padding: 3px 8px; font-size: 12px; color: var(--muted); background: #fbfbfc; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ruler { height: 26px; display: block; width: 100%; background: #fbfbfc; border-bottom: 1px solid var(--line); cursor: crosshair; }
.lanes-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; min-height: 0; }
.lanes { display: block; width: 100%; cursor: grab; }
.lanes.dragging { cursor: grabbing; }
#drop { position: fixed; inset: 0; background: rgba(37,99,235,.08); border: 3px dashed var(--accent); display: none; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); z-index: 10; }
#empty { margin: auto; color: var(--muted); text-align: center; max-width: 520px; padding: 40px; }
.node-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: center; padding: 5px 10px; border-bottom: 1px solid #f0f2f4; cursor: pointer; }
.node-row:hover { background: #f5f8ff; }
.node-row.sel { background: #e8efff; }
.sw { width: 12px; height: 12px; border-radius: 3px; }
.node-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node-sub { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
.node-dur { width: 58px; font-family: var(--mono); font-size: 11.5px; padding: 1px 3px; border: 1px solid var(--line); border-radius: 4px; }
.sect { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
.sect:first-child { margin-top: 2px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; background: #fff; }
.card h3 { margin: 0 0 6px; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 2px 8px; }
.kv .k { color: var(--muted); }
.kv .v { font-family: var(--mono); font-size: 12px; word-break: break-word; }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 2px 4px; }
table.t td { border-bottom: 1px solid #f2f3f5; padding: 2px 4px; font-family: var(--mono); vertical-align: top; }
a.lnk { color: var(--accent); cursor: pointer; text-decoration: none; }
a.lnk:hover { text-decoration: underline; }
.crit { color: var(--dep); font-weight: 600; }
.muted { color: var(--muted); }
.mini { display: block; margin-top: 6px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
#tip { position: fixed; pointer-events: none; background: rgba(17,24,39,.92); color: #fff; padding: 6px 8px; border-radius: 6px; font-size: 12px; display: none; z-index: 20; max-width: 360px; }
#tip .m { font-family: var(--mono); }
.legend-note { padding: 8px 10px; color: var(--muted); font-size: 12px; }
.toggle { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Megakernel Plan Viewer</h1>
    <button id="open">Open files</button>
    <input id="file" type="file" multiple accept=".json" hidden>
    <div class="files" id="files"></div>
    <span class="grow"></span>
    <label class="toggle">GPU <select id="gpu"></select></label>
    <label class="toggle" title="the cost records' statistic used as a task's time">time <select id="stat">
      <option value="median_us">median</option><option value="p75_us" selected>p75</option><option value="p90_us">p90</option></select></label>
    <label class="toggle" title="only the records of this kernel version (static_schedule.code_tag)">code <select id="code"></select></label>
    <label class="toggle" title="only the records measured on this GPU type">on <select id="mgpu"></select></label>
    <label class="toggle"><input type="checkbox" id="arrows" checked> dependencies</label>
    <button id="fit" title="whole timeline">Fit</button>
  </header>
  <main>
    <div id="left"></div>
    <div id="center"><div id="empty">Open a plan's <span style="font-family:var(--mono)">schedule_gpu*.json</span> files (opened together:
      one plan) and cost files (<span style="font-family:var(--mono)">costs/*.json</span>), or drop them here. Two or more plans: one time
      axis for all.</div></div>
    <div id="right"><div class="muted">Click a task bar, or a node on the left.</div></div>
  </main>
</div>
<div id="drop">Drop view files</div>
<div id="tip"></div>
<script type="application/json" id="preload">[]</script>
<script>
"use strict";
// ---------------- state ----------------
const PALETTE = ["#4e79a7", "#f28e2b", "#59a14f", "#e15759", "#76b7b2", "#edc948", "#b07aa1", "#ff9da7", "#9c755f", "#86bcb6",
  "#d37295", "#8cd17d", "#499894", "#f1ce63", "#a0cbe8", "#ffbe7d", "#79706e", "#b6992d"];
const DT_BYTES = { bf16: 2, fp16: 2, fp32: 4, fp8: 1, int32: 4, uint32: 4, int64: 8, uint64: 8, int16: 2, uint16: 2, uint8: 1, int8: 1,
  bfloat16: 2, float16: 2, float32: 4 };
const ROW_H = 13, LABEL_W = 46;
const S = { files: [], costs: [], gpu: 0, view: null, sel: null, selNode: null, arrows: true, panes: [], durs: {},
  stat: "p75_us", code: "", mgpu: "" };   // p75: the loop model's rule D4 (10-14: 1.9 us short of the measured MoE hand plan, median 7.0)
// S.files = the plans (one per group of schedule files); S.costs = the cost files' records; S.view = the time window all panes share
// {t0, t1} us; S.sel = {file, gpu, task}; S.selNode = node key (string); S.durs = per node name the typed-in time (us) of tasks
// without a record

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (v, d = 2) => v == null || !isFinite(v) ? "—" : (+v).toFixed(d);
const med = (a) => { if (!a.length) return null; const b = [...a].sort((x, y) => x - y); const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };

// ---------------- model ----------------
// a plan from its schedule files (one per GPU, compiler.compile_plan): per GPU tasks [{id, node, pos, deps, cons, sm, li}]
function makePlan(name, scheds) {
  scheds.sort((a, b) => a.info.gpu - b.info.gpu);
  const nodes = scheds[0].nodes, nodeKeys = Object.keys(nodes).sort((a, b) => +a - +b);
  if (!nodes[nodeKeys[0]].tensors) throw new Error(`${name}: schedule files without the node tensors (written by an older compiler.compile_plan)`);
  const f = { name, doc: { nodes, cluster_size: scheds[0].info.cluster_size || 1, title: name }, nodeKeys, gpus: [], on: true };
  for (const sc of scheds) {
    const tasks = sc.all_tasks.map((t, id) => ({ id, node: String(t.node), pos: t.pos, deps: t.deps, cons: [], sm: -1, li: -1 }));
    for (const t of tasks) for (const d of t.deps) tasks[d].cons.push(t.id);
    sc.worker_task_queues.forEach((l, sm) => l.forEach((tid, li) => { tasks[tid].sm = sm; tasks[tid].li = li; }));
    f.gpus.push({ gpu: sc.info.gpu, tasks, lists: sc.worker_task_queues });
  }
  return f;
}

// cost records (cost_records.py) as search.Costs reads them: a task type + cost key; context first_on_sm
const canon = (v) => Array.isArray(v) ? "[" + v.map(canon).join(",") + "]" : v && typeof v === "object"
  ? "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}" : JSON.stringify(v);
function records() {
  return S.costs.flatMap((c) => c.records).filter((r) => (!S.code || r.code === S.code) && (!S.mgpu || (r.machine || {}).gpu === S.mgpu));
}
function costIndex() {
  const idx = new Map();
  for (const r of records()) { const k = r.task_type + " " + canon(r.key); (idx.get(k) || idx.set(k, []).get(k)).push(r); }
  return idx;
}
// {behind, first, pool, n}: a task behind another on its SM (search.Costs.task_us: records not first on the SM, else all), the
// first on an SM (first_us; none: behind), a one-task-per-SM node's total work (pool_us); n = records used; null: no record
function nodeCost(idx, node) {
  const val = (rs) => rs.length ? Math.max(0, med(rs.map((r) => r[S.stat] != null ? r[S.stat] : r.median_us))) : null;
  if (node.one_task_per_sm) {
    const rs = idx.get(node.name + " " + canon(node.pool_key)) || [];
    return rs.length ? { pool: val(rs), n: rs.length } : null;
  }
  const rs = idx.get(node.name + " " + canon(node.cost_key)) || [];
  if (!rs.length) return null;
  const notFirst = rs.filter((r) => (r.context || {}).first_on_sm === false), first = rs.filter((r) => (r.context || {}).first_on_sm === true);
  const behind = val(notFirst.length ? notFirst : rs);
  return { behind, first: first.length ? val(first) : behind, n: rs.length };
}

// the solver's rules (solver.py) on the plan's lists: a task starts when its SM is free and the tasks it waits for have ended; the
// tasks of a concurrent group start together; the pool opens when its producers' tasks have ended, each SM joins it when free (the
// tasks before it in its list done), it ends at max(open + W / SMs, the last join, (W + sum of joins) / SMs); the tasks after it
// on an SM start at its end
function simulate(f) {
  const idx = costIndex();
  f.cost = {};
  for (const k of f.nodeKeys) f.cost[k] = nodeCost(idx, f.doc.nodes[k]);
  const fallback = (k) => { const n = f.doc.nodes[k].name; return S.durs[n] != null ? S.durs[n] : 1.0; };
  for (const g of f.gpus) {
    const T = g.tasks, L = g.lists, nsm = L.length;
    const poolKey = f.nodeKeys.find((k) => f.doc.nodes[k].one_task_per_sm);
    for (const t of T) {
      const c = f.cost[t.node];
      t.est = !c; t.start = t.end = null; t.s0 = t.s1 = null;
      t.dur = c ? (t.li === 0 ? c.first : c.behind) : fallback(t.node);
    }
    // concurrent groups: the node's tasks whose positions differ only in that axis
    const group = new Map();
    for (const k of f.nodeKeys) {
      const ax = f.doc.nodes[k].concurrent_along_axis; if (ax == null) continue;
      const by = {};
      T.filter((t) => t.node === k).forEach((t) => { const key = t.pos.filter((_, i) => i !== ax).join(); (by[key] = by[key] || []).push(t.id); });
      Object.values(by).forEach((ids) => ids.forEach((id) => group.set(id, ids)));
    }
    const ptr = new Array(nsm).fill(0), free = new Array(nsm).fill(0);
    const pool = poolKey ? { key: poolKey, producers: new Set((f.doc.nodes[poolKey].producers || []).filter((p) => p != null).map(String)),
      W: f.cost[poolKey] ? f.cost[poolKey].pool : fallback(poolKey) * nsm, joins: {}, end: null } : null;
    const head = (sm) => ptr[sm] < L[sm].length ? T[L[sm][ptr[sm]]] : null;
    const ready = (t) => t.deps.every((d) => T[d].end != null);
    const readyAt = (t) => Math.max(free[t.sm], ...t.deps.map((d) => T[d].end), 0);
    let guard = 0, progress = true;
    while (progress && guard++ < 4 * T.length + 10) {
      progress = false;
      for (let sm = 0; sm < nsm; sm++) {
        for (let t = head(sm); t; t = head(sm)) {
          if (pool && t.node === pool.key) {
            if (t.id in pool.joins) break;
            const prod = T.filter((x) => pool.producers.has(x.node));
            if (!prod.every((x) => x.end != null)) break;
            const open = Math.max(0, ...prod.map((x) => x.end));
            pool.open = open; pool.joins[t.id] = Math.max(open, free[sm]); progress = true; break;
          }
          if (!ready(t)) break;
          const g2 = group.get(t.id);
          if (g2) {
            if (!g2.every((id) => head(T[id].sm) === T[id] && ready(T[id]))) break;
            const st = Math.max(...g2.map((id) => readyAt(T[id])));
            for (const id of g2) { const x = T[id]; x.start = st; x.end = st + x.dur; free[x.sm] = x.end; ptr[x.sm]++; }
          } else { t.start = readyAt(t); t.end = t.start + t.dur; free[sm] = t.end; ptr[sm]++; }
          progress = true;
        }
      }
      if (!progress && pool && pool.end == null) {   // every SM waits at the pool (or is done): it can end now
        const pt = T.filter((t) => t.node === pool.key);
        if (pt.length && pt.every((t) => t.id in pool.joins)) {
          const js = pt.map((t) => pool.joins[t.id]), n = pt.length;
          pool.end = Math.max(pool.open + pool.W / n, ...js, (pool.W + js.reduce((a, b) => a + b, 0)) / n);
          for (const t of pt) { t.start = pool.joins[t.id]; t.end = pool.end; t.dur = t.end - t.start; free[t.sm] = t.end; ptr[t.sm]++; }
          progress = true;
        }
      }
    }
    g.deadlock = T.filter((t) => t.end == null).length;
    T.forEach((t) => { if (t.end == null) { t.start = 0; t.end = 0; } });
    g.span = [Math.min(...T.map((t) => t.start)), Math.max(...T.map((t) => t.end))];
    g.pool = pool;
  }
}

function textOn(hex) {   // dark text on light bars, white on dark ones
  const v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
  return 0.299 * r + 0.587 * g + 0.114 * b > 150 ? "rgba(17,24,39,.85)" : "rgba(255,255,255,.95)";
}
function color(f, node) { return PALETTE[f.nodeKeys.indexOf(node) % PALETTE.length]; }
function nodeLabel(f, node) { return `${f.doc.nodes[node].name}#${node}`; }

// MPK's slice rule (compiler.box): grid axis a with map[a] = d >= 0 cuts dimension d in grid[a] equal blocks
function box(tensor, grid, pos) {
  const r = tensor.dims.map((d) => [0, d]);
  tensor.map.forEach((d, a) => { if (d >= 0) { const b = tensor.dims[d] / grid[a]; r[d] = [pos[a] * b, (pos[a] + 1) * b]; } });
  return r;
}
function tileDims(tensor, grid) { return tensor.dims.map((d, i) => { const a = tensor.map.indexOf(i); return a >= 0 ? d / grid[a] : d; }); }

// ---------------- panes ----------------
function activeFiles() { return S.files.filter((f) => f.on); }

function buildPanes() {
  const center = $("center");
  center.innerHTML = "";
  S.panes = [];
  const act = activeFiles();
  if (!act.length) { center.innerHTML = `<div id="empty">Open one or more view files.</div>`; return; }
  for (const f of act) {
    const gi = Math.min(S.gpu, f.gpus.length - 1);
    simulate(f);
    const el = document.createElement("div");
    el.className = "pane";
    const g = f.gpus[gi];
    const est = g.tasks.filter((x) => x.est).length, nrec = records().length;
    el.innerHTML = `<div class="pane-title"><b>${esc(f.name)}</b> · GPU ${g.gpu} of ${f.gpus.length} · ${g.tasks.length} tasks on ${g.lists.length} SMs ·
      end ${fmt(g.span[1])} us · times: ${S.costs.length ? `${nrec} cost records (${S.stat.replace("_us", "")})` : "no cost file"}${est ? ` · ${est} tasks without a record (typed-in time, dashed)` : ""}
      ${g.pool && g.pool.end != null ? ` · pool ${esc(f.doc.nodes[g.pool.key].name)} opens ${fmt(g.pool.open)}, ends ${fmt(g.pool.end)}` : ""}
      ${g.deadlock ? ` · <span class="crit">${g.deadlock} tasks never ready</span>` : ""}</div>
      <canvas class="ruler"></canvas><div class="lanes-wrap"><canvas class="lanes"></canvas></div>`;
    center.appendChild(el);
    const p = { f, gi, el, ruler: el.querySelector(".ruler"), wrap: el.querySelector(".lanes-wrap"), cv: el.querySelector(".lanes") };
    S.panes.push(p);
    attach(p);
  }
  if (!S.view) fitView();
  drawAll();
}

function fitView() {
  let a = Infinity, b = -Infinity;
  for (const p of S.panes) { const g = p.f.gpus[p.gi]; a = Math.min(a, g.span[0]); b = Math.max(b, g.span[1]); }
  if (!isFinite(a)) { a = 0; b = 1; }
  const pad = (b - a) * 0.02 || 0.5;
  S.view = { t0: a - pad, t1: b + pad };
}

function xOf(p, t) { const w = p.cv.clientWidth - LABEL_W; return LABEL_W + (t - S.view.t0) / (S.view.t1 - S.view.t0) * w; }
function tOf(p, x) { const w = p.cv.clientWidth - LABEL_W; return S.view.t0 + (x - LABEL_W) / w * (S.view.t1 - S.view.t0); }

function sizeCanvas(cv, h) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || cv.parentElement.clientWidth;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  cv.style.height = h + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

function ticks(p) {
  const span = S.view.t1 - S.view.t0, w = p.cv.clientWidth - LABEL_W;
  const target = span / Math.max(1, w) * 90, mag = Math.pow(10, Math.floor(Math.log10(target || 1)));
  const step = ([1, 2, 5, 10].find((m) => m * mag >= target) || 10) * mag;
  const out = [];
  for (let t = Math.ceil(S.view.t0 / step) * step; t <= S.view.t1; t += step) out.push(+t.toFixed(6));
  return out;
}

function drawAll() { for (const p of S.panes) draw(p); }

function draw(p) {
  const g = p.f.gpus[p.gi], f = p.f, T = g.tasks, nsm = g.lists.length;
  const H = nsm * ROW_H + 6;
  const ctx = sizeCanvas(p.cv, H), W = p.cv.clientWidth;
  ctx.clearRect(0, 0, W, H);
  // lane stripes + labels
  ctx.font = "10px ui-monospace, Menlo, monospace"; ctx.textBaseline = "middle";
  for (let sm = 0; sm < nsm; sm++) {
    const y = sm * ROW_H;
    if (sm % 2) { ctx.fillStyle = "#f7f8fa"; ctx.fillRect(0, y, W, ROW_H); }
    if (f.doc.cluster_size === 2 && sm % 2 === 0) { ctx.fillStyle = "#e9ecf0"; ctx.fillRect(LABEL_W - 3, y + 2, 2, 2 * ROW_H - 4); }
    ctx.fillStyle = "#8a919c"; ctx.fillText(String(sm), 4, y + ROW_H / 2);
  }
  // gridlines
  ctx.strokeStyle = "rgba(0,0,0,.06)"; ctx.beginPath();
  for (const t of ticks(p)) { const x = Math.round(xOf(p, t)) + .5; ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  ctx.stroke();
  // task bars
  const selT = S.sel && S.sel.file === f && S.sel.gpu === p.gi ? T[S.sel.task] : null;
  const rel = selT ? new Set([selT.id, ...selT.deps, ...selT.cons]) : null;
  for (const t of T) {
    if (t.sm < 0) continue;
    const x0 = xOf(p, t.start), x1 = xOf(p, t.end);
    if (x1 < LABEL_W || x0 > W) continue;
    const y = t.sm * ROW_H + 1, h = ROW_H - 2;
    const dim = (S.selNode && t.node !== S.selNode) || (rel && !rel.has(t.id));
    ctx.globalAlpha = dim ? 0.22 : 1;
    ctx.fillStyle = color(f, t.node);
    const bx = Math.max(LABEL_W, x0), bw = Math.max(1, x1 - bx);
    if (t.est) {
      ctx.globalAlpha *= 0.45; ctx.fillRect(bx, y, bw, h); ctx.globalAlpha = dim ? 0.22 : 1;
      ctx.setLineDash([3, 2]); ctx.strokeStyle = color(f, t.node); ctx.strokeRect(bx + .5, y + .5, bw - 1, h - 1); ctx.setLineDash([]);
    } else ctx.fillRect(bx, y, bw, h);
    // stage stamps: white tick = stage 0, black tick = stage 1
    if (t.s0 != null) { ctx.fillStyle = "#fff"; ctx.fillRect(xOf(p, t.s0) - .5, y, 1.5, h); }
    if (t.s1 != null) { ctx.fillStyle = "#111"; ctx.fillRect(xOf(p, t.s1) - .5, y, 1.5, h); }
    if (bw > 34) {
      ctx.fillStyle = textOn(color(f, t.node)); ctx.font = "9.5px system-ui, sans-serif";
      ctx.save(); ctx.beginPath(); ctx.rect(bx, y, bw, h); ctx.clip();
      ctx.fillText(`${f.doc.nodes[t.node].name} ${t.pos.join(",")}`, bx + 3, y + h / 2 + .5); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  // selection + dependency lines
  if (selT) {
    const y = selT.sm * ROW_H;
    ctx.strokeStyle = "#111827"; ctx.lineWidth = 2;
    ctx.strokeRect(xOf(p, selT.start) - 1, y, Math.max(2, xOf(p, selT.end) - xOf(p, selT.start)) + 2, ROW_H);
    ctx.lineWidth = 1;
    if (S.arrows) {
      const crit = critical(g, selT);
      const line = (a, b, col, w) => {
        const xa = xOf(p, a.end), ya = a.sm * ROW_H + ROW_H / 2, xb = xOf(p, b.start), yb = b.sm * ROW_H + ROW_H / 2;
        ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(xa, ya);
        ctx.bezierCurveTo(xa + 20, ya, xb - 20, yb, xb, yb); ctx.stroke();
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xb, yb, 2.2, 0, 7); ctx.fill();
      };
      for (const d of selT.deps) line(T[d], selT, d === crit ? "rgba(220,38,38,.95)" : "rgba(220,38,38,.35)", d === crit ? 2 : 1);
      for (const c of selT.cons) line(selT, T[c], "rgba(37,99,235,.35)", 1);
      ctx.lineWidth = 1;
    }
  }
  // ruler
  const rc = sizeCanvas(p.ruler, 26), RW = p.ruler.clientWidth;
  rc.clearRect(0, 0, RW, 26); rc.font = "10px system-ui, sans-serif"; rc.fillStyle = "#6b7380"; rc.textBaseline = "middle";
  rc.fillText("SM / us", 4, 13);
  rc.strokeStyle = "rgba(0,0,0,.18)"; rc.beginPath();
  for (const t of ticks(p)) { const x = Math.round(xOf(p, t)) + .5; if (x < LABEL_W) continue; rc.moveTo(x, 18); rc.lineTo(x, 26); rc.fillText(String(t), x + 3, 10); }
  rc.stroke();
}

// the dependency that ended last (the one the task waited for longest)
function critical(g, t) { let best = -1, e = -Infinity; for (const d of t.deps) if (g.tasks[d].end > e) { e = g.tasks[d].end; best = d; } return best; }

function hit(p, x, y) {
  const g = p.f.gpus[p.gi], sm = Math.floor(y / ROW_H), t = tOf(p, x);
  if (sm < 0 || sm >= g.lists.length || x < LABEL_W) return null;
  const tol = (S.view.t1 - S.view.t0) / Math.max(1, p.cv.clientWidth) * 3;
  let best = null;
  for (const tid of g.lists[sm]) { const k = g.tasks[tid]; if (t >= k.start - tol && t <= k.end + tol) best = k; }
  return best;
}

let DRAG = null;   // {p, x, t0, t1, moved}: the lanes being dragged (one handler for every pane)
window.addEventListener("mousemove", (e) => {
  if (!DRAG) return;
  const dx = e.clientX - DRAG.x; if (Math.abs(dx) > 3) DRAG.moved = true;
  const d = -dx / Math.max(1, DRAG.p.cv.clientWidth - LABEL_W) * (DRAG.t1 - DRAG.t0);
  S.view.t0 = DRAG.t0 + d; S.view.t1 = DRAG.t1 + d; drawAll();
});
window.addEventListener("mouseup", (e) => {
  if (!DRAG) return;
  const p = DRAG.p; p.cv.classList.remove("dragging");
  if (!DRAG.moved && e.target === p.cv) {
    const r = p.cv.getBoundingClientRect(), k = hit(p, e.clientX - r.left, e.clientY - r.top);
    if (k) select(p.f, p.gi, k.id); else { S.sel = null; renderDetail(); drawAll(); }
  }
  DRAG = null;
});

function attach(p) {
  p.cv.addEventListener("wheel", (e) => {
    if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {          // pan
      e.preventDefault();
      const d = (e.shiftKey ? e.deltaY : e.deltaX) / Math.max(1, p.cv.clientWidth - LABEL_W) * (S.view.t1 - S.view.t0);
      S.view.t0 += d; S.view.t1 += d; drawAll(); return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) {                               // zoom at the cursor
      e.preventDefault();
      const r = p.cv.getBoundingClientRect(), t = tOf(p, e.clientX - r.left), k = Math.exp(e.deltaY * 0.0025);
      S.view.t0 = t - (t - S.view.t0) * k; S.view.t1 = t + (S.view.t1 - t) * k; drawAll();
    }
  }, { passive: false });
  p.ruler.addEventListener("wheel", (e) => {                                 // the ruler: plain wheel zooms
    e.preventDefault();
    const r = p.ruler.getBoundingClientRect(), t = tOf(p, e.clientX - r.left), k = Math.exp(e.deltaY * 0.0025);
    S.view.t0 = t - (t - S.view.t0) * k; S.view.t1 = t + (S.view.t1 - t) * k; drawAll();
  }, { passive: false });
  p.cv.addEventListener("mousedown", (e) => { DRAG = { p, x: e.clientX, t0: S.view.t0, t1: S.view.t1, moved: false }; p.cv.classList.add("dragging"); });
  p.cv.addEventListener("dblclick", (e) => {
    const r = p.cv.getBoundingClientRect(), k = hit(p, e.clientX - r.left, e.clientY - r.top);
    if (!k) return; const w = Math.max(0.05, k.end - k.start);
    S.view = { t0: k.start - w * 1.5, t1: k.end + w * 1.5 }; drawAll();
  });
  p.cv.addEventListener("mousemove", (e) => {
    const r = p.cv.getBoundingClientRect(), k = hit(p, e.clientX - r.left, e.clientY - r.top), tip = $("tip");
    if (!k || DRAG) { tip.style.display = "none"; return; }
    const n = p.f.doc.nodes[k.node], dur = k.end - k.start;
    tip.innerHTML = `<b>${esc(n.name)}#${k.node}</b> task <span class="m">(${k.pos.join(", ")})</span><br>
      SM <span class="m">${k.sm}</span>, list position ${k.li + 1} of ${p.f.gpus[p.gi].lists[k.sm].length}<br>
      <span class="m">${fmt(k.start)} → ${fmt(k.end)} us (${fmt(dur)} us)</span>${k.est ? " · no cost record" : ""}
      <br>waits for ${k.deps.length} tasks · ${k.cons.length} wait for it`;
    tip.style.display = "block";
    tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 14) + "px";
    tip.style.top = Math.min(window.innerHeight - tip.offsetHeight - 8, e.clientY + 14) + "px";
  });
  p.cv.addEventListener("mouseleave", () => { $("tip").style.display = "none"; });
  p.wrap.addEventListener("scroll", () => { for (const q of S.panes) if (q !== p && q.wrap.scrollTop !== p.wrap.scrollTop) q.wrap.scrollTop = p.wrap.scrollTop; });
}

// ---------------- selection + detail ----------------
function select(f, gi, tid) {
  S.sel = { file: f, gpu: gi, task: tid };
  S.selNode = null;
  renderLeft(); renderDetail(); drawAll();
}
function selectNode(node) { S.selNode = S.selNode === node ? null : node; S.sel = null; renderLeft(); renderDetail(); drawAll(); }

function reveal(f, gi, tid) {
  const p = S.panes.find((q) => q.f === f); if (!p) return;
  const t = f.gpus[gi].tasks[tid];
  const vh = p.wrap.clientHeight, y = t.sm * ROW_H;
  if (y < p.wrap.scrollTop || y > p.wrap.scrollTop + vh - ROW_H) p.wrap.scrollTop = Math.max(0, y - vh / 2);
  if (t.end < S.view.t0 || t.start > S.view.t1) { const w = S.view.t1 - S.view.t0, m = (t.start + t.end) / 2; S.view = { t0: m - w / 2, t1: m + w / 2 }; }
}

function taskRef(f, gi, tid, extra = "") {
  const t = f.gpus[gi].tasks[tid];
  return `<a class="lnk" data-task="${tid}">${esc(nodeLabel(f, t.node))} (${t.pos.join(",")})</a> <span class="muted">SM ${t.sm}, ends ${fmt(t.end)}</span>${extra}`;
}

function sliceStr(r) { return "[" + r.map(([a, b]) => b - a === 0 ? "∅" : `${a}:${b}`).join(", ") + "]"; }
function cutStr(tensor, grid) {
  const parts = [];
  tensor.map.forEach((d, a) => { if (d >= 0) parts.push(`${"xyz"[a]}→d${d} ÷${grid[a]}`); });
  return parts.length ? parts.join(" ") : "whole";
}
function elems(r) { return r.reduce((s, [a, b]) => s * (b - a), 1); }
function bytesStr(n) { return n >= 1 << 20 ? (n / 1048576).toFixed(2) + " MB" : n >= 1024 ? (n / 1024).toFixed(1) + " KB" : n + " B"; }

function renderDetail() {
  const R = $("right");
  if (S.sel) { R.innerHTML = taskCard(S.sel.file, S.sel.gpu, S.sel.task) + nodeCard(S.sel.file, S.sel.gpu, S.sel.file.gpus[S.sel.gpu].tasks[S.sel.task].node); }
  else if (S.selNode) { const p = S.panes[0]; R.innerHTML = p ? nodeCard(p.f, p.gi, S.selNode) : ""; }
  else { R.innerHTML = `<div class="muted">Click a task bar, or a node on the left.<br><br>Wheel over the ruler, or Ctrl+wheel over the lanes: zoom.
    Drag or Shift+wheel: pan. Double-click a task: zoom to it.<br>Bars: one task, colored by node, timed from the cost records as the search's
    model does and laid out by the solver's rules; dashed = no cost record (the time typed in on the left).</div>`; }
  R.querySelectorAll("a.lnk[data-task]").forEach((a) => a.addEventListener("click", () => {
    const tid = +a.dataset.task; select(S.sel.file, S.sel.gpu, tid); reveal(S.sel.file, S.sel.gpu, tid); drawAll();
  }));
  R.querySelectorAll("canvas.mini").forEach((c) => drawMini(c));
}

function taskCard(f, gi, tid) {
  const g = f.gpus[gi], t = g.tasks[tid], n = f.doc.nodes[t.node];
  const crit = critical(g, t);
  const rows = [["node", `${esc(n.name)}#${t.node}`], ["grid position", `(${t.pos.join(", ")}) of (${n.grid.join(", ")})`],
    ["GPU / SM", `${g.gpu} / ${t.sm}${f.doc.cluster_size === 2 ? ` (cluster ${t.sm >> 1}, CTA ${t.sm & 1})` : ""}`],
    ["list position", `${t.li + 1} of ${g.lists[t.sm].length}`],
    ["start → end", `${fmt(t.start)} → ${fmt(t.end)} us`],
    ["duration", `${fmt(t.end - t.start)} us ${t.est ? '<span class="crit">no cost record: the typed-in time</span>' : n.one_task_per_sm ? "(its share of the pool)" : t.li === 0 ? "(first on its SM)" : "(behind another task)"}`]];
  const smFree = t.li > 0 ? g.tasks[g.lists[t.sm][t.li - 1]].end : 0;
  if (crit >= 0) rows.push(["waited for", `${fmt(Math.max(0, g.tasks[crit].end - smFree))} us after its SM was free <span class="muted">(last input ends ${fmt(g.tasks[crit].end)})</span>`]);
  let h = `<div class="sect">Task</div><div class="card"><h3><span class="sw" style="background:${color(f, t.node)}"></span>${esc(n.name)}#${t.node} (${t.pos.join(",")})</h3>
    <div class="kv">${rows.map(([k, v]) => `<div class="k">${k}</div><div class="v">${v}</div>`).join("")}</div>`;
  h += `<div class="sect">slices it reads and writes</div><table class="t"><tr><th></th><th>tensor</th><th>slice</th><th>size</th></tr>`;
  for (const ten of n.tensors) {
    const r = box(ten, n.grid, t.pos), e = elems(r);
    h += `<tr><td>${ten.io}</td><td>${esc(ten.name)}</td><td>${sliceStr(r)}</td><td>${bytesStr(e * (DT_BYTES[ten.dtype] || 0))}</td></tr>`;
  }
  h += `</table>`;
  if (t.deps.length) {
    const deps = [...t.deps].sort((a, b) => g.tasks[b].end - g.tasks[a].end);
    h += `<div class="sect">waits for ${t.deps.length} tasks (latest first)</div><div>${deps.slice(0, 24).map((d) => `<div>${taskRef(f, gi, d, d === crit ? ' <span class="crit">last</span>' : "")}</div>`).join("")}
      ${deps.length > 24 ? `<div class="muted">… ${deps.length - 24} more</div>` : ""}</div>`;
  }
  if (t.cons.length) {
    h += `<div class="sect">${t.cons.length} tasks wait for it</div><div>${t.cons.slice(0, 12).map((c) => `<div>${taskRef(f, gi, c)}</div>`).join("")}
      ${t.cons.length > 12 ? `<div class="muted">… ${t.cons.length - 12} more</div>` : ""}</div>`;
  }
  // the same task in the other open files (compare)
  const others = activeFiles().filter((o) => o !== f);
  if (others.length) {
    h += `<div class="sect">same task in the other files</div><table class="t"><tr><th>file</th><th>SM</th><th>start</th><th>dur</th></tr>`;
    for (const o of others) {
      const og = o.gpus[Math.min(S.gpu, o.gpus.length - 1)];
      const ot = og.tasks.find((x) => x.node === t.node && x.pos.join() === t.pos.join());
      h += ot ? `<tr><td>${esc(o.name)}</td><td>${ot.sm}</td><td>${fmt(ot.start)}</td><td>${fmt(ot.end - ot.start)}${ot.est ? " est" : ""}</td></tr>`
              : `<tr><td>${esc(o.name)}</td><td colspan="3" class="muted">no such task (other grid?)</td></tr>`;
    }
    h += `</table>`;
  }
  return h + `</div>`;
}

function nodeCard(f, gi, node) {
  const g = f.gpus[gi], n = f.doc.nodes[node];
  const T = g.tasks.filter((t) => t.node === node);
  const durs = T.map((t) => t.end - t.start), starts = T.map((t) => t.start), ends = T.map((t) => t.end);
  const ntot = n.grid[0] * n.grid[1] * n.grid[2];
  const perSm = {}; T.forEach((t) => { perSm[t.sm] = (perSm[t.sm] || 0) + 1; });
  const hist = {}; Object.values(perSm).forEach((c) => { hist[c] = (hist[c] || 0) + 1; });
  const sms = Object.keys(perSm).map(Number).sort((a, b) => a - b);
  const ranges = []; for (const s of sms) { const l = ranges[ranges.length - 1]; if (l && l[1] === s - 1) l[1] = s; else ranges.push([s, s]); }
  const flags = [n.rows_split_over_gpus && "rows split over the GPUs", n.concurrent_along_axis != null && `tasks along axis ${"xyz"[n.concurrent_along_axis]} run together`,
    n.one_task_per_sm && "one task per SM", n.dry && "dry pass"].filter(Boolean);
  const last = T.reduce((b, t) => !b || t.end > b.end ? t : b, null);
  let h = `<div class="sect">Node</div><div class="card"><h3><span class="sw" style="background:${color(f, node)}"></span>${esc(n.name)}#${node}</h3><div class="kv">
    <div class="k">grid</div><div class="v">(${n.grid.join(", ")}) = ${ntot} tasks${T.length !== ntot ? `, ${T.length} on this GPU` : ""}</div>
    <div class="k">params</div><div class="v">[${n.params.join(", ")}]</div>
    ${flags.length ? `<div class="k">notes</div><div class="v">${flags.join("; ")}</div>` : ""}
    <div class="k">on SMs</div><div class="v">${sms.length} SMs: ${ranges.map(([a, b]) => a === b ? a : `${a}-${b}`).join(", ")}</div>
    <div class="k">tasks per SM</div><div class="v">${Object.entries(hist).map(([c, k]) => `${k} SMs × ${c}`).join(", ")}</div>
    <div class="k">start</div><div class="v">${fmt(Math.min(...starts))} first, ${fmt(med(starts))} median</div>
    <div class="k">end</div><div class="v">${fmt(med(ends))} median, ${fmt(Math.max(...ends))} last${last ? ` (${taskRef(f, gi, last.id)})` : ""}</div>
    <div class="k">task time</div><div class="v">${fmt(Math.min(...durs))} min, ${fmt(med(durs))} median, ${fmt(Math.max(...durs))} max us</div>
    <div class="k">cost records</div><div class="v">${costLine(f, node)}</div>
    <div class="k">cost key</div><div class="v">${esc(JSON.stringify(n.one_task_per_sm ? n.pool_key : n.cost_key))}</div>
    </div>`;
  h += `<div class="sect">tensors: whole → one task's tile</div><table class="t"><tr><th></th><th>tensor</th><th>dims → tile</th><th>cut by</th></tr>`;
  for (const ten of n.tensors) {
    const tile = tileDims(ten, n.grid);
    h += `<tr><td>${ten.io}</td><td>${esc(ten.name)}<br><span class="muted">${esc(ten.dtype)}</span></td><td>[${ten.dims.join("×")}] → [${tile.join("×")}]</td><td>${cutStr(ten, n.grid)}</td></tr>`;
  }
  h += `</table><div class="sect">split map (grid x → right, y ↓; color: task time; label: SM)</div>
    <canvas class="mini" data-node="${node}" data-gpu="${gi}" data-file="${S.files.indexOf(f)}"></canvas></div>`;
  return h;
}

// the node's grid as cells: x across, (y, z) down; color by task time, the SM written in each cell
function drawMini(c) {
  const f = S.files[+c.dataset.file], gi = +c.dataset.gpu, node = c.dataset.node, g = f.gpus[gi], n = f.doc.nodes[node];
  const [gx, gy, gz] = n.grid, rowsN = gy * gz;
  const W = c.parentElement.clientWidth - 2, cw = Math.max(3, Math.min(28, Math.floor(W / gx))), ch = Math.max(8, Math.min(22, cw));
  const dpr = window.devicePixelRatio || 1, cssW = gx * cw + 1, cssH = rowsN * ch + 1;
  c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr); c.style.width = cssW + "px"; c.style.height = cssH + "px";
  const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cssW, cssH);
  const T = g.tasks.filter((t) => t.node === node), by = new Map(T.map((t) => [t.pos.join(), t]));
  const ds = T.map((t) => t.end - t.start), lo = Math.min(...ds), hi = Math.max(...ds);
  for (let z = 0; z < gz; z++) for (let y = 0; y < gy; y++) for (let x = 0; x < gx; x++) {
    const t = by.get([x, y, z].join()), px = x * cw, py = (z * gy + y) * ch;
    if (!t) { ctx.fillStyle = "#eef0f3"; ctx.fillRect(px, py, cw - 1, ch - 1); continue; }
    const u = hi > lo ? (t.end - t.start - lo) / (hi - lo) : 0.5;
    ctx.fillStyle = `hsl(${210 - 200 * u}, 70%, ${62 - 12 * u}%)`; ctx.fillRect(px, py, cw - 1, ch - 1);
    if (S.sel && S.sel.file === f && S.sel.task === t.id) { ctx.strokeStyle = "#111"; ctx.lineWidth = 2; ctx.strokeRect(px + 1, py + 1, cw - 3, ch - 3); ctx.lineWidth = 1; }
    if (cw >= 16) { ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.font = "8.5px ui-monospace, monospace"; ctx.textBaseline = "middle"; ctx.fillText(String(t.sm), px + 2, py + ch / 2); }
  }
  c.onclick = (e) => {
    const r = c.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / cw), row = Math.floor((e.clientY - r.top) / ch);
    const t = by.get([x, row % gy, Math.floor(row / gy)].join());
    if (t) { select(f, gi, t.id); reveal(f, gi, t.id); drawAll(); }
  };
  c.onmousemove = (e) => {
    const r = c.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / cw), row = Math.floor((e.clientY - r.top) / ch);
    const t = by.get([x, row % gy, Math.floor(row / gy)].join()), tip = $("tip");
    if (!t) { tip.style.display = "none"; return; }
    tip.innerHTML = `task <span class="m">(${t.pos.join(", ")})</span> · SM ${t.sm} · <span class="m">${fmt(t.end - t.start)} us</span>`;
    tip.style.display = "block"; tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px";
  };
  c.onmouseleave = () => { $("tip").style.display = "none"; };
}

// ---------------- left: nodes ----------------
function costLine(f, k) {
  const c = f.cost && f.cost[k];
  if (!c) return '<span class="crit">none</span>';
  return c.pool != null ? `pool work ${fmt(c.pool)} us (${c.n} records)` : `${fmt(c.behind)} us behind, ${fmt(c.first)} first on its SM (${c.n} records)`;
}
function renderLeft() {
  const L = $("left"), p = S.panes[0];
  if (!p) { L.innerHTML = ""; return; }
  const f = p.f, g = f.gpus[p.gi];
  let h = `<div class="legend-note">${f.nodeKeys.length} nodes · ${g.tasks.length} tasks on GPU ${g.gpu}. A node with no cost record takes the time typed in (us).</div>`;
  for (const k of f.nodeKeys) {
    const n = f.doc.nodes[k], T = g.tasks.filter((t) => t.node === k), c = f.cost && f.cost[k];
    const val = c ? `<span class="node-sub" title="from the cost records">${fmt(c.pool != null ? c.pool / Math.max(1, T.length) : c.behind)}</span>`
      : `<input class="node-dur" data-name="${esc(n.name)}" value="${S.durs[n.name] != null ? S.durs[n.name] : 1}" title="no cost record: task time (us)">`;
    h += `<div class="node-row${S.selNode === k ? " sel" : ""}" data-node="${k}"><span class="sw" style="background:${color(f, k)}"></span>
      <div><div class="node-name">${esc(n.name)}#${k}</div><div class="node-sub">grid ${n.grid.join("×")} · ${T.length} tasks${c ? "" : " · no record"}</div></div>${val}</div>`;
  }
  L.innerHTML = h;
  L.querySelectorAll(".node-row").forEach((r) => r.addEventListener("click", (e) => { if (e.target.tagName !== "INPUT") selectNode(r.dataset.node); }));
  L.querySelectorAll("input.node-dur").forEach((i) => i.addEventListener("change", () => {
    const v = parseFloat(i.value); if (isFinite(v) && v >= 0) { S.durs[i.dataset.name] = v; refresh(false); }
  }));
}

// ---------------- files ----------------
function renderFiles() {
  $("files").innerHTML = S.files.map((f, i) => `<label class="chip"><input type="checkbox" data-i="${i}" ${f.on ? "checked" : ""}>${esc(f.name)}</label>`).join("")
    + S.costs.map((c) => `<span class="chip" title="${c.records.length} records">⏱ ${esc(c.name)}</span>`).join("");
  $("files").querySelectorAll("input").forEach((c) => c.addEventListener("change", () => { S.files[+c.dataset.i].on = c.checked; S.sel = null; refresh(true); }));
  const n = Math.max(1, ...S.files.map((f) => f.gpus.length));
  $("gpu").innerHTML = Array.from({ length: n }, (_, i) => `<option value="${i}" ${i === S.gpu ? "selected" : ""}>${i}</option>`).join("");
  const all = S.costs.flatMap((c) => c.records);
  const opts = (vals, cur, label) => `<option value="">${label}</option>` + [...new Set(vals.filter(Boolean))].sort().map((v) => `<option ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
  $("code").innerHTML = opts(all.map((r) => r.code), S.code, "any");
  $("mgpu").innerHTML = opts(all.map((r) => (r.machine || {}).gpu), S.mgpu, "any GPU");
}
function refresh(refit) { if (refit) S.view = null; buildPanes(); renderLeft(); renderDetail(); }
// files: schedule_gpu*.json (compile_plan) and cost files ({"records": [...]}); the schedule files of one batch (one open / drop, or
// one directory given to plan_viewer.py) are one plan; a GPU number seen twice in a batch starts another plan
function addBatch(items) {
  const groups = new Map();
  for (const it of items) {
    const d = it.data;
    if (d && Array.isArray(d.records)) { S.costs.push({ name: it.name, records: d.records }); continue; }
    if (!d || !d.worker_task_queues || !d.nodes) { alert(`${it.name}: neither a schedule file nor a cost file`); continue; }
    const g = it.group || "plan " + (S.files.length + 1);
    let list = groups.get(g); if (!list) groups.set(g, list = [[]]);
    let cur = list[list.length - 1]; if (cur.some((x) => x.info.gpu === d.info.gpu)) list.push(cur = []);
    cur.push(d);
  }
  for (const [g, lists] of groups) lists.forEach((sc, i) => {
    try { S.files.push(makePlan(lists.length > 1 ? `${g} (${i + 1})` : g, sc)); } catch (e) { alert(e.message); }
  });
  renderFiles(); refresh(true);
}
async function readFiles(list) {
  const items = [];
  for (const file of list) { try { items.push({ name: file.name, data: JSON.parse(await file.text()) }); } catch (e) { alert(`${file.name}: ${e.message}`); } }
  addBatch(items);
}

$("open").onclick = () => $("file").click();
$("file").onchange = (e) => readFiles(e.target.files);
$("gpu").onchange = (e) => { S.gpu = +e.target.value; S.sel = null; refresh(true); };
$("arrows").onchange = (e) => { S.arrows = e.target.checked; drawAll(); };
$("stat").onchange = (e) => { S.stat = e.target.value; refresh(false); };
$("code").onchange = (e) => { S.code = e.target.value; refresh(false); };
$("mgpu").onchange = (e) => { S.mgpu = e.target.value; refresh(false); };
$("fit").onclick = () => { fitView(); drawAll(); };
let dragDepth = 0;
window.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; $("drop").style.display = "flex"; });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").style.display = "none"; } });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; $("drop").style.display = "none"; readFiles(e.dataTransfer.files); });
window.addEventListener("resize", () => { drawAll(); renderDetail(); });
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const w = S.view && S.view.t1 - S.view.t0; if (!w) return;
  if (e.key === "+" || e.key === "=") { S.view = { t0: S.view.t0 + w * .15, t1: S.view.t1 - w * .15 }; drawAll(); }
  if (e.key === "-") { S.view = { t0: S.view.t0 - w * .2, t1: S.view.t1 + w * .2 }; drawAll(); }
  if (e.key === "Escape") { S.sel = null; S.selNode = null; renderLeft(); renderDetail(); drawAll(); }
});

addBatch(JSON.parse($("preload").textContent || "[]"));
// the URL's #gpu=G&task=ID / #node=K: open with that GPU / task / node selected (a link to one view)
(function fromHash() {
  const q = new URLSearchParams(location.hash.slice(1)), f = activeFiles()[0];
  if (!f) { renderDetail(); return; }
  if (q.has("gpu")) { S.gpu = +q.get("gpu"); renderFiles(); refresh(true); }
  if (q.has("task")) { select(f, Math.min(S.gpu, f.gpus.length - 1), +q.get("task")); reveal(f, Math.min(S.gpu, f.gpus.length - 1), +q.get("task")); drawAll(); }
  else if (q.has("node")) selectNode(q.get("node"));
  else renderDetail();
})();
</script>
