name: mpk-qwen-ci
on:
  push:
    branches: [mpk]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mpk-qwen-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gpu-inference:
    runs-on: [self-hosted, gpu, b200]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -l {0}

    env:
      CUBLAS_WORKSPACE_CONFIG: ":16:8"
      PYTHONUNBUFFERED: "1"
      HF_HOME: "/raid/catalyst/models"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup conda environment
        run: |
          conda create -n mirage-ci-${{ github.run_id }} python=3.11 -y

      - name: Install mirage
        run: |
          conda activate mirage-ci-${{ github.run_id }}
          pip install -e . -v
          pip install pytest

      - name: Set Envs
        run: |
          echo "MIRAGE_HOME=$PWD" >> $GITHUB_ENV
          CUDA_VISIBLE_DEVICES=$(bash scripts/find_idle_gpus.sh --num-gpus 1)
          echo "CUDA_VISIBLE_DEVICES=$CUDA_VISIBLE_DEVICES" >> $GITHUB_ENV

      - name: Run sequential online-serving functional test
        timeout-minutes: 40
        run: |
          conda activate mirage-ci-${{ github.run_id }}
          python tests/ci-tests/run_online_serving_test.py \
            --scenario sequential

      - name: Run concurrent online-serving overlap test
        timeout-minutes: 40
        run: |
          conda activate mirage-ci-${{ github.run_id }}
          python tests/ci-tests/run_online_serving_test.py \
            --scenario concurrent

      - name: Run Qwen3 Torch vs MPK comparison
        timeout-minutes: 10
        env:
          MIRAGE_HOME: ${{ env.MIRAGE_HOME }}
        run: |
          conda activate mirage-ci-${{ github.run_id }}
          bash tests/ci-tests/run_ci_tests_qwen3.sh

      - name: Run MPK batch size performance test
        timeout-minutes: 30
        env:
          MIRAGE_HOME: ${{ env.MIRAGE_HOME }}
        run: |
          conda activate mirage-ci-${{ github.run_id }}
          for r in 1 2 4 8; do
            echo "::group::batch size $r"
            python tests/ci-tests/run_batch_perf.py \
              --max-num-batched-requests "$r" --ignore-eos
            echo "::endgroup::"
          done
          python - <<'EOF'
          import glob, json
          print(f"{'requests':>9} {'tokens':>7} {'total_ms':>9} "
                f"{'ms/token':>9} {'tokens/s':>9}")
          for path in sorted(glob.glob("outputs/qwen3/batch_perf_*.json")):
              with open(path) as f:
                  m = json.load(f)
              print(f"{m['max_num_batched_requests']:>9} "
                    f"{m['max_num_batched_tokens']:>7} "
                    f"{m['total_time_ms']:>9.1f} "
                    f"{m['latency_ms_per_token']:>9.3f} "
                    f"{m['throughput_tokens_per_s']:>9.1f}")
          EOF

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpk-qwen-outputs
          path: |
            outputs/
            logs/

      - name: Clean up workspace
        if: always()
        run: |
          conda env remove -n mirage-ci-${{ github.run_id }} -y
          rm -rf "${{ github.workspace }}/*"
